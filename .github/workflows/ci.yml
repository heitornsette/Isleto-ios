# Builds and tests the iOS app on a macOS runner (there is no Mac locally).
# No secrets are used: the .ipa is built without a real signature and is signed
# later, on the user's PC, by Sideloadly with a free Apple ID.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Build, testes e capturas
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Versões das ferramentas
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Instalar XcodeGen e ldid
        run: brew install xcodegen ldid

      - name: Testes do IsletoCore (macOS)
        run: |
          mkdir -p build/logs
          if ! swift test --package-path Packages/IsletoCore >build/logs/swift-test.log 2>&1; then
            bash scripts/ci/annotate-errors.sh build/logs/swift-test.log "Testes do IsletoCore (macOS)"
            tail -n 80 build/logs/swift-test.log
            exit 1
          fi
          grep -E 'Executed|passed|failed' build/logs/swift-test.log | tail -n 3

      - name: Gerar Isleto.xcodeproj
        run: xcodegen generate

      - name: Testes do IsletoCore (simulador iOS)
        run: |
          bash scripts/ci/test-on-simulator.sh || {
            bash scripts/ci/annotate-errors.sh build/logs/test-simulator.log "Testes do IsletoCore (simulador)"
            exit 1
          }

      - name: Gerar Isleto.ipa (sem assinatura + ldid)
        run: |
          bash scripts/ci/build-ipa.sh || {
            bash scripts/ci/annotate-errors.sh build/logs/archive.log "Build do app"
            exit 1
          }

      - name: Capturas de tela no simulador
        run: |
          bash scripts/ci/screenshots.sh || {
            bash scripts/ci/annotate-errors.sh build/logs/sim-build.log "Build no simulador"
            exit 1
          }

      - name: Publicar Isleto.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Isleto-ipa
          path: build/Isleto.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publicar capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-tela
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 30

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: build/logs
          if-no-files-found: ignore
          retention-days: 14
