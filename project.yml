# XcodeGen spec. Generate the project with `xcodegen generate` (done by the CI).
# Isleto.xcodeproj and the Info.plist files are generated: do not commit them.
#
# Free Apple ID: each target with a bundle ID (app, extensions) uses one App ID,
# and only 10 new App IDs per week. Do not add and remove targets casually.
name: Isleto

options:
  bundleIdPrefix: app.isleto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    # Same value as in both .entitlements files (ldid cannot expand variables).
    APP_GROUP_ID: group.app.isleto.ios
    # Overridden by the CI with the short commit hash, shown in the app diagnostics.
    ISLETO_COMMIT: local

packages:
  IsletoCore:
    path: Packages/IsletoCore

targets:
  Isleto:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: IsletoCore
      # Embedded in Isleto.app/PlugIns.
      - target: IsletoWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Isleto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        IsletoAppGroup: $(APP_GROUP_ID)
        IsletoCommit: $(ISLETO_COMMIT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.isleto.ios
        CODE_SIGN_ENTITLEMENTS: App/Isleto.entitlements

  # Widget + Live Activity in one extension (one App ID).
  IsletoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: IsletoCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Isleto Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        IsletoAppGroup: $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.isleto.ios.widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/IsletoWidgets.entitlements

schemes:
  Isleto:
    build:
      targets:
        Isleto: all
